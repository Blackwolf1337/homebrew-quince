# Workflow of the tap repo: builds the formula from source and runs its test
name: test

on:
  push:
  workflow_dispatch:

jobs:
  formula:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Tap
        # this checkout as the tap (macOS's bash 3.2 has no ${var,,}, so the name is spelled out)
        run: brew tap blackwolf1337/quince "$PWD"
      - name: Audit
        run: brew audit --strict --formula blackwolf1337/quince/quince
      - name: Install
        run: brew install --build-from-source --verbose blackwolf1337/quince/quince
      - name: Test
        run: brew test blackwolf1337/quince/quince
